name: super_container_extensions
description: Extensions de composants modulaires (SuperChart, etc.) pour le moteur super_container_layout.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_code_editor: ^0.3.5
  flutter_localizations:
    sdk: flutter
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  material_ui: ^1.5.0
  super_container_layout:
    path: ../super_container_layout
  yaml: ^3.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
