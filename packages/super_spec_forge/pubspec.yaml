name: super_spec_forge
description: Application et bibliothèque de forge de cahier des charges, objets métiers et règles de gestion par wizard de chat IA spécialisé.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  highlight: ^0.7.0
  material_ui: ^1.5.0
  shared_preferences: ^2.5.5
  shortid: 0.1.2
  super_container_layout:
    path: ../super_container_layout
  super_schema_dsl:
    path: ../super_schema_dsl
  webview_flutter: ^4.14.1
  webview_flutter_windows: ^1.3.1
  yaml: ^3.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/markdown_viewer/

