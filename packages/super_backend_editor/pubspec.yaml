name: super_backend_editor
description: Studio Desktop et bibliothèque d'import, d'édition et d'exécution de la spécification Design d'un domaine métier au-dessus de super_backend.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_js: ^0.8.7
  material_ui: ^1.5.0
  shared_preferences: ^2.5.5
  super_backend:
    path: ../super_backend
  super_container_extensions:
    path: ../super_container_extensions
  super_container_layout:
    path: ../super_container_layout
  super_schema_dsl:
    path: ../super_schema_dsl
  uuid: ^4.5.1
  yaml: ^3.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
